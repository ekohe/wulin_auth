image: ruby:4.0.9

stages:
  - test

services:
  - postgres:latest

variables:
  POSTGRES_DB: wulin_auth_test
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: ''
  POSTGRES_HOST_AUTH_METHOD: trust

default:
  before_script:
    - bundle config set --local path vendor/bundle
    - bundle install --jobs 8
  cache:
    key:
      files:
        - Gemfile.lock
    paths:
      - vendor/bundle

build:
  stage: test
  script:
    - gem build wulin_auth.gemspec

test:
  stage: test
  before_script:
    - apt-get update -qy
    - apt-get install -qy nodejs libfontconfig1
    - cp spec/dummy/config/database.ci.yml spec/dummy/config/database.yml
    - bundle config set --local path vendor/bundle
    - bundle install --jobs 8
  script:
    - RAILS_ENV=test bundle exec rails db:schema:load
    - bundle exec rspec
